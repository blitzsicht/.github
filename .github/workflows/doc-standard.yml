name: doc-standard

on:
  workflow_call:
    inputs:
      profil:
        description: "Repo-Profil (S/M/L/W). Leer = pruefe-repo.sh liest AGENTS.md."
        type: string
        required: false
        default: ''
      drift-pfade:
        description: "Komma-separierte Pfadliste für Drift-Hinweis-Job."
        type: string
        required: false
        default: ''
      pfad:
        description: "Wurzelpfad des zu prüfenden Repos (relativ zum Checkout)."
        type: string
        required: false
        default: '.'

# Deny-all auf Top-Ebene; Jobs überschreiben nur, was sie brauchen.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pruefe-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: pruefe-repo.sh
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ inputs.pfad }}"

          PASS=0
          FAIL=0
          HINWEIS=0

          ok()     { echo "  ok: $1";     PASS=$((PASS+1)); }
          fehler() { echo "FEHLER: $1";   FAIL=$((FAIL+1)); }
          hinweis(){ echo "HINWEIS: $1";  HINWEIS=$((HINWEIS+1)); }

          # ── R-AGENTS-EXIST ────────────────────────────────────────────────────────────
          if [ -f "$REPO/AGENTS.md" ]; then
            ok "R-AGENTS-EXIST: AGENTS.md vorhanden"
          else
            fehler "R-AGENTS-EXIST: AGENTS.md fehlt"
          fi

          # ── R-AGENTS-PROFIL ───────────────────────────────────────────────────────────
          profil_line="$(grep -m1 '^Profil: [SMLW]$' "$REPO/AGENTS.md" 2>/dev/null || true)"
          if [ -n "$profil_line" ]; then
            ok "R-AGENTS-PROFIL: Zeile 'Profil: <S|M|L|W>' vorhanden"
          else
            fehler "R-AGENTS-PROFIL: Keine gültige Profil-Zeile (^Profil: [SMLW]$) in AGENTS.md"
          fi

          # ── Profil auslesen ───────────────────────────────────────────────────────────
          PROFIL=""
          if [ -n "$profil_line" ]; then
            PROFIL="${profil_line#Profil: }"
          fi

          # ── R-CLAUDE-EXIST ────────────────────────────────────────────────────────────
          if [ -f "$REPO/CLAUDE.md" ]; then
            ok "R-CLAUDE-EXIST: CLAUDE.md vorhanden"
          else
            fehler "R-CLAUDE-EXIST: CLAUDE.md fehlt"
          fi

          # ── R-CLAUDE-AT ───────────────────────────────────────────────────────────────
          first_line="$(head -1 "$REPO/CLAUDE.md" 2>/dev/null || true)"
          if [ "$first_line" = "@AGENTS.md" ]; then
            ok "R-CLAUDE-AT: erste Zeile von CLAUDE.md ist '@AGENTS.md'"
          else
            fehler "R-CLAUDE-AT: erste Zeile von CLAUDE.md ist '$first_line' (erwartet: @AGENTS.md)"
          fi

          # ── Profil-spezifische Regeln ─────────────────────────────────────────────────
          case "$PROFIL" in
            M|L)
              # R-DOCS-INDEX
              if [ -f "$REPO/docs/INDEX.md" ]; then
                ok "R-DOCS-INDEX: docs/INDEX.md vorhanden"
              else
                fehler "R-DOCS-INDEX: docs/INDEX.md fehlt"
              fi

              # R-DOCS-BETRIEB
              if [ -f "$REPO/docs/BETRIEB.md" ]; then
                ok "R-DOCS-BETRIEB: docs/BETRIEB.md vorhanden"
              else
                fehler "R-DOCS-BETRIEB: docs/BETRIEB.md fehlt"
              fi

              # R-REMOTE
              remote_out="$(git -C "$REPO" remote 2>/dev/null || true)"
              if [ -n "$remote_out" ]; then
                ok "R-REMOTE: git remote konfiguriert"
              else
                fehler "R-REMOTE: kein git remote konfiguriert"
              fi

              if [ "$PROFIL" = "L" ]; then
                # R-ARCHITEKTUR
                if [ -f "$REPO/docs/ARCHITEKTUR.md" ]; then
                  ok "R-ARCHITEKTUR: docs/ARCHITEKTUR.md vorhanden"
                else
                  fehler "R-ARCHITEKTUR: docs/ARCHITEKTUR.md fehlt"
                fi

                # R-MERMAID
                mermaid_count="$(grep -c '^```mermaid' "$REPO/docs/ARCHITEKTUR.md" 2>/dev/null || echo 0)"
                if [ "$mermaid_count" -gt 0 ]; then
                  ok "R-MERMAID: Mermaid-Block in docs/ARCHITEKTUR.md vorhanden"
                else
                  fehler "R-MERMAID: kein Mermaid-Block (^\`\`\`mermaid) in docs/ARCHITEKTUR.md"
                fi

                # R-DECISIONS
                if [ -d "$REPO/docs/decisions" ]; then
                  ok "R-DECISIONS: Verzeichnis docs/decisions vorhanden"
                else
                  fehler "R-DECISIONS: Verzeichnis docs/decisions fehlt"
                fi
              fi
              ;;

            S|W)
              # R-REMOTE-SW — Hinweis statt Fehler
              remote_out="$(git -C "$REPO" remote 2>/dev/null || true)"
              if [ -z "$remote_out" ]; then
                hinweis "R-REMOTE-SW: kein git remote konfiguriert (bei Profil $PROFIL optional)"
              else
                ok "R-REMOTE-SW: git remote konfiguriert"
              fi
              ;;

            "")
              # Profil nicht lesbar — Regeln übersprungen, FEHLER schon oben gezählt
              ;;

            *)
              fehler "Unbekanntes Profil '$PROFIL'"
              ;;
          esac

          # ── Zusammenfassung ───────────────────────────────────────────────────────────
          echo ""
          echo "PASS=$PASS FAIL=$FAIL HINWEIS=$HINWEIS"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
          exit 0

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '${{ inputs.pfad }}/**/*.md'
          config: '.markdownlint-cli2.yaml'

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: '--offline ${{ inputs.pfad }}'
          fail: true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Gitleaks secret scan
        shell: bash
        run: |
          # Update: neue Version auf https://github.com/gitleaks/gitleaks/releases prüfen; SHA256 aus gitleaks_VERSION_checksums.txt
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --no-git --source "${{ inputs.pfad }}"

  drift-hinweis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && inputs.drift-pfade != ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const driftPfade = '${{ inputs.drift-pfade }}'.split(',').map(p => p.trim()).filter(Boolean);
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const geaendert = files.filter(f =>
              driftPfade.some(p => f.filename.startsWith(p))
            ).map(f => `- \`${f.filename}\``);

            if (geaendert.length === 0) return;

            let body = '## Drift-Hinweis: Docs-Standard-Dateien geändert\n\n';
            body += 'Diese Dateien im PR betreffen den Docs-Standard:\n\n';
            body += geaendert.join('\n');

            if (files.length >= 100) {
              body += '\n\n> **Hinweis:** PR hat ≥ 100 Dateien — Liste ggf. unvollständig.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
