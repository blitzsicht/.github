# Reusable Workflow des Doku-Standards. Aufruf aus einem anderen Repo: standard/beispiel-aufruf.yml.
#
# Prüft das aufrufende Repo mit standard/pruefe-repo.sh aus DIESEM Repo (keine Kopie im Workflow),
# lintet nur geänderte Markdown-Dateien, prüft deren interne Links, scannt den Diff auf Secrets
# und schreibt auf Wunsch einen Drift-Hinweis als PR-Kommentar (nie ein Fehlschlag).
#
# Seit v1.1:
# - `runs-on` wählt den Runner, auch einen eigenen mit arm64. Werkzeuge lädt
#   standard/werkzeuge-laden.sh passend zur Architektur.
# - Lint und Links laufen mit Ratchet (standard/basis-vergleich.sh): Neue Dateien werden streng
#   geprüft. Geänderte Dateien dürfen nicht mehr Befunde haben als an der Basis, damit ein Repo
#   mit Altlasten den Standard einführen kann, ohne vorher alles zu bereinigen.
name: doc-standard

on:
  workflow_call:
    inputs:
      profil:
        description: "S, M, L oder W. Leer: Zeile 'Profil:' aus AGENTS.md."
        type: string
        default: ''
      pfad:
        description: "Wurzel des geprüften Repos relativ zum Checkout."
        type: string
        default: '.'
      drift-pfade:
        description: "Eine Regel je Zeile: 'code/pfad -> docs/datei.md'. Leer: kein Drift-Hinweis."
        type: string
        default: ''
      standard-ref:
        description: "Stand von blitzsicht/.github, aus dem Skript und Lint-Regeln kommen. Gleich dem Ref im uses: halten."
        type: string
        default: 'main'
      runs-on:
        description: "Runner-Label für alle Jobs, z. B. ein eigener Runner. Linux mit bash, curl, git, npm; x64 oder arm64."
        type: string
        default: 'ubuntu-latest'

permissions: {}

concurrency:
  group: doc-standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STANDARD_REPO: blitzsicht/.github

jobs:
  aenderungen:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      md: ${{ steps.diff.outputs.md }}
      basis: ${{ steps.diff.outputs.basis }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      - id: diff
        shell: bash
        env:
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          VORHER: ${{ github.event.before }}
          PFAD: ${{ inputs.pfad }}
        run: |
          basis="${PR_BASIS:-$VORHER}"
          # Neuer Branch (before = 000…) oder unbekannte Basis: alles gilt als geändert.
          if [ -z "$basis" ] || ! git cat-file -e "$basis^{commit}" 2>/dev/null; then basis=""; fi
          bash .doc-standard/standard/md-dateien.sh "$basis" "$PFAD" > md-nur.txt
          echo "basis=$basis" >> "$GITHUB_OUTPUT"
          if [ -s md-nur.txt ]; then echo "md=true" >> "$GITHUB_OUTPUT"; else echo "md=false" >> "$GITHUB_OUTPUT"; fi
          echo "Geänderte Markdown-Dateien: $(wc -l < md-nur.txt)"

  pruefe-repo:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      - shell: bash
        env:
          PROFIL: ${{ inputs.profil }}
          PFAD: ${{ inputs.pfad }}
        run: bash .doc-standard/standard/pruefe-repo.sh ${PROFIL:+--profil "$PROFIL"} "$PFAD"

  markdownlint:
    needs: aenderungen
    if: needs.aenderungen.outputs.md == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      # markdownlint-cli2 als CLI statt der Action, gelintet in einer Kopie (markdown-lint.sh):
      # im Repo lädt es `.markdownlint*.cjs/.mjs` des geprüften Repos per require/import.
      - shell: bash
        env:
          BASIS: ${{ needs.aenderungen.outputs.basis }}
          PFAD: ${{ inputs.pfad }}
        run: |
          command -v npm >/dev/null || { echo "::error::npm fehlt auf dem Runner"; exit 1; }
          # Außerhalb des Repos installieren: npm läse sonst eine `.npmrc` des geprüften Repos
          # (z. B. eine fremde Registry) und führte von dort geladenen Code aus. Nicht global:
          # auf einem eigenen Runner fehlt dem Job-Nutzer dafür meist das Schreibrecht.
          (cd "$RUNNER_TEMP" && npm install --prefix "$RUNNER_TEMP/mdl" --ignore-scripts --no-audit --no-fund markdownlint-cli2@0.24.0)
          export MARKDOWNLINT="$RUNNER_TEMP/mdl/node_modules/.bin/markdownlint-cli2"
          export REGELSATZ="$PWD/.doc-standard/.markdownlint-cli2.yaml"
          bash .doc-standard/standard/basis-vergleich.sh lint "$BASIS" "$PFAD"

  links:
    needs: aenderungen
    if: needs.aenderungen.outputs.md == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      # lychee als CLI mit Prüfsumme statt der lychee-Action: die Action setzt ihre Argumente
      # per eval in eine Shell-Zeile, ein Dateiname wie `x$(befehl).md` lief dort als Befehl.
      - shell: bash
        env:
          BASIS: ${{ needs.aenderungen.outputs.basis }}
          PFAD: ${{ inputs.pfad }}
        run: |
          LYCHEE=$(bash .doc-standard/standard/werkzeuge-laden.sh lychee "$RUNNER_TEMP/werkzeuge")
          export LYCHEE
          bash .doc-standard/standard/basis-vergleich.sh links "$BASIS" "$PFAD"

  secrets:
    needs: aenderungen
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      # gitleaks als CLI mit Prüfsumme: die gitleaks-Action verlangt für Organisationen eine Lizenz.
      # Geladen nach $RUNNER_TEMP, damit das Programm nicht selbst im gescannten Baum liegt.
      - shell: bash
        env:
          BASIS: ${{ needs.aenderungen.outputs.basis }}
        run: |
          GITLEAKS=$(bash .doc-standard/standard/werkzeuge-laden.sh gitleaks "$RUNNER_TEMP/werkzeuge")
          # Der Standard-Checkout gehört nicht zum geprüften Repo; ohne Basis scannte `dir` ihn mit.
          rm -rf .doc-standard
          if [ -n "$BASIS" ]; then
            # --text: sonst macht `* -diff` in der .gitattributes des Repos jeden Diff „binär“,
            # gitleaks sieht ~0 Bytes und meldet „no leaks found“ (nachgestellt, mit --text: Fund).
            "$GITLEAKS" git --no-banner --redact --log-opts="--text ${BASIS}..HEAD" .
          else
            "$GITLEAKS" dir --no-banner --redact .
          fi

  drift-hinweis:
    if: github.event_name == 'pull_request' && inputs.drift-pfade != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          DRIFT_PFADE: ${{ inputs.drift-pfade }}
        with:
          script: |
            const regeln = process.env.DRIFT_PFADE.split('\n')
              .map(z => z.split('->').map(t => t.trim()))
              .filter(t => t.length === 2 && t[0] && t[1]);
            const dateien = (await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            })).map(f => f.filename);
            const treffer = regeln.filter(([code, doku]) =>
              dateien.some(f => f.startsWith(code)) && !dateien.some(f => f.startsWith(doku)));
            if (treffer.length === 0) return;
            const marke = '<!-- doc-standard:drift -->';
            const body = `${marke}\n**Drift-Hinweis:** Code geändert, zugehörige Doku nicht.\n\n` +
              treffer.map(([code, doku]) => `- \`${code}\` geändert, \`${doku}\` nicht`).join('\n') +
              '\n\nNur ein Hinweis, der Lauf schlägt dadurch nicht fehl.';
            const kommentare = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const alt = kommentare.find(k => k.body && k.body.startsWith(marke));
            if (alt) await github.rest.issues.updateComment({ ...context.repo, comment_id: alt.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
