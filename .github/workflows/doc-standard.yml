# Reusable Workflow des Doku-Standards. Aufruf aus einem anderen Repo: standard/beispiel-aufruf.yml.
#
# Prüft das aufrufende Repo mit standard/pruefe-repo.sh aus DIESEM Repo (keine Kopie im Workflow),
# lintet nur geänderte Markdown-Dateien, prüft deren interne Links, scannt den Diff auf Secrets
# und schreibt auf Wunsch einen Drift-Hinweis als PR-Kommentar (nie ein Fehlschlag).
#
# Seit v1.1:
# - `runs-on` wählt den Runner, auch einen eigenen mit arm64. Werkzeuge lädt
#   standard/werkzeuge-laden.sh passend zur Architektur.
# - Lint und Links laufen mit Ratchet (standard/basis-vergleich.sh): Neue Dateien werden streng
#   geprüft. Geänderte Dateien dürfen nicht mehr Befunde haben als an der Basis, damit ein Repo
#   mit Altlasten den Standard einführen kann, ohne vorher alles zu bereinigen.
#
# Seit v1.2:
# - Alle Prüfungen laufen in EINEM Job `pruefen`. Auf eigenen Runnern dauerten die fünf Jobs
#   zusammen ~80 s, warteten aber je 3–35 min auf einen freien Runner, und Lint, Links und
#   Secrets reihten sich erst hinter dem Tor ein: zwei Wartezeiten hintereinander, fünf Plätze.
#   Jeder Prüfschritt läuft auch nach einem roten Schritt (`!cancelled()`), damit ein Befund den
#   nächsten nicht verdeckt. Statt einer roten Zeile je Prüfung steht eine Tabelle in der
#   Zusammenfassung des Laufs.
# - Der Standard liegt nach dem Checkout unter $RUNNER_TEMP, nicht im geprüften Baum: pruefe-repo.sh
#   und gitleaks sahen ihn sonst als Teil des Repos.
# - Tor und Secret-Scan stehen in Skripten mit eigenem Test (aenderungen.sh, secrets-pruefen.sh).
# - `lint-ignores` nimmt Dateien vom Lint aus, die nicht umformatiert werden dürfen.
#
# Bewusste Grenzen:
# - `runs-on` nimmt genau ein Label, keine Liste und keine Gruppe.
# - Eigene Runner: Dieser Workflow liest Dateien aus dem PR. Für PRs aus Forks keinen Runner mit
#   Zugang zu internen Netzen oder Zugangsdaten nehmen; Symlinks lehnt basis-vergleich.sh ab.
# - Eine Umbenennung über die Grenze von `pfad` hinweg gilt als neue Datei (streng).
# - Das geprüfte Repo darf die Prüfung sichtbar lockern: `.lycheeignore` (liest lychee),
#   `<!-- markdownlint-disable -->` in einer Datei, Pfade unter den `ignores` des Regelsatzes,
#   `lint-ignores` im Aufruf (jede Ausnahme steht als HINWEIS im Log). Die Prüfung schützt vor
#   Versehen und vor Code aus dem PR, nicht vor einem Autor, der sie im Diff abschaltet.
#   Dasselbe gilt für `.gitleaks.toml` und `.gitleaksignore`: gitleaks liest beide aus dem
#   geprüften Repo, ein Eintrag dort kann einen Fund ausblenden.
# - Geprüft werden nur geänderte Markdown-Dateien. Löscht oder verschiebt ein PR ein Linkziel,
#   bricht der Link in einer unveränderten Datei, ohne dass dieser Lauf es meldet.
# - markdownlint-cli2 ist auf die Version gepinnt, seine Abhängigkeiten nicht (kein Lockfile).
# - Rechte: Der Aufrufer gibt `contents: read` und `pull-requests: write`. Letzteres braucht nur
#   der Drift-Hinweis; ob ein Aufruf ohne es startet, wenn `drift-pfade` leer ist, ist ungeprüft.
# - Kein Pfadfilter, auch nicht im Beispielaufruf: der Secret-Scan soll Code-PRs ebenso sehen,
#   und ein Lauf belegt nur einen Runner-Platz.
# - Der Drift-Hinweis läuft nur für PRs aus demselben Repo: bei Fork-PRs ist das Token nur lesend.
name: doc-standard

on:
  workflow_call:
    inputs:
      profil:
        description: "S, M, L oder W. Leer: Zeile 'Profil:' aus AGENTS.md."
        type: string
        default: ''
      pfad:
        description: "Wurzel des geprüften Repos relativ zum Checkout."
        type: string
        default: '.'
      drift-pfade:
        description: "Eine Regel je Zeile: 'code/pfad -> docs/datei.md'. Leer: kein Drift-Hinweis."
        type: string
        default: ''
      standard-ref:
        description: "Stand von blitzsicht/.github, aus dem Skript und Lint-Regeln kommen. Gleich dem Ref im uses: halten."
        type: string
        default: 'main'
      runs-on:
        description: "Ein Runner-Label für alle Jobs, z. B. ein eigener Runner. Linux mit bash, curl, git, npm; x64 oder arm64."
        type: string
        default: 'ubuntu-latest'
      lint-ignores:
        description: "Ein Glob je Zeile, relativ zur Repo-Wurzel: vom Markdown-Lint ausgenommen (Links werden weiter geprüft)."
        type: string
        default: ''

permissions: {}

concurrency:
  # runs-on, pfad und profil im Namen: zwei Aufrufe aus demselben Lauf (Matrix, mehrere
  # Teilbäume) brachen sich sonst gegenseitig ab. Abbrechen nur in PRs: auf einem Branch bliebe
  # sonst der frühere von zwei schnellen Pushes ungeprüft.
  group: doc-standard-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runs-on }}-${{ inputs.pfad }}-${{ inputs.profil }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STANDARD_REPO: blitzsicht/.github

jobs:
  pruefen:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Ein gleichnamiger Eintrag aus dem PR (etwa ein Symlink nach außerhalb des Workspace)
      # würde vom folgenden Checkout geleert und überschrieben. Inline, nicht als Skript: der
      # Standard ist an dieser Stelle noch nicht da.
      - name: Kein .doc-standard im geprüften Repo
        shell: bash
        run: |
          if [ -e .doc-standard ] || [ -L .doc-standard ]; then
            echo "::error::Das geprüfte Repo enthält .doc-standard; der Name ist für den Standard reserviert."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.STANDARD_REPO }}
          ref: ${{ inputs.standard-ref }}
          path: .doc-standard
          persist-credentials: false
      # checkout legt nur unterhalb des Workspace ab. Gleich danach raus aus dem geprüften Baum,
      # bevor irgendetwas aus dem Repo gelesen wird.
      - id: standard
        name: Standard aus dem geprüften Baum nehmen
        shell: bash
        run: |
          ziel="$RUNNER_TEMP/standard"
          [ ! -e "$ziel" ] || { echo "::error::$ziel existiert schon"; exit 1; }
          mv .doc-standard "$ziel"
          echo "STANDARD=$ziel" >> "$GITHUB_ENV"
      - id: aenderungen
        name: Tor (geänderte Markdown-Dateien)
        shell: bash
        env:
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          VORHER: ${{ github.event.before }}
          PFAD: ${{ inputs.pfad }}
        run: bash "$STANDARD/standard/aenderungen.sh" "${PR_BASIS:-$VORHER}" "$PFAD" "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
      - id: repo
        name: Struktur (pruefe-repo.sh)
        if: ${{ !cancelled() && steps.standard.outcome == 'success' }}
        shell: bash
        env:
          PROFIL: ${{ inputs.profil }}
          PFAD: ${{ inputs.pfad }}
        run: bash "$STANDARD/standard/pruefe-repo.sh" ${PROFIL:+--profil "$PROFIL"} "$PFAD"
      # markdownlint-cli2 als CLI statt der Action, gelintet in einer Kopie (markdown-lint.sh):
      # im Repo lädt es `.markdownlint*.cjs/.mjs` des geprüften Repos per require/import.
      - id: lint
        name: Markdown-Lint (Ratchet)
        if: ${{ !cancelled() && steps.aenderungen.outcome == 'success' && steps.aenderungen.outputs.md == 'true' }}
        shell: bash
        env:
          BASIS: ${{ steps.aenderungen.outputs.basis }}
          PFAD: ${{ inputs.pfad }}
          LINT_AUSNAHMEN: ${{ inputs.lint-ignores }}
        run: |
          command -v npm >/dev/null || { echo "::error::npm fehlt auf dem Runner"; exit 1; }
          # Außerhalb des Repos installieren: npm läse sonst eine `.npmrc` des geprüften Repos
          # (z. B. eine fremde Registry) und führte von dort geladenen Code aus. Nicht global:
          # auf einem eigenen Runner fehlt dem Job-Nutzer dafür meist das Schreibrecht.
          (cd "$RUNNER_TEMP" && npm install --prefix "$RUNNER_TEMP/mdl" --ignore-scripts --no-audit --no-fund markdownlint-cli2@0.24.0)
          export MARKDOWNLINT="$RUNNER_TEMP/mdl/node_modules/.bin/markdownlint-cli2"
          export REGELSATZ="$STANDARD/.markdownlint-cli2.yaml"
          bash "$STANDARD/standard/basis-vergleich.sh" lint "$BASIS" "$PFAD"
      # lychee als CLI mit Prüfsumme statt der lychee-Action: die Action setzt ihre Argumente
      # per eval in eine Shell-Zeile, ein Dateiname wie `x$(befehl).md` lief dort als Befehl.
      - id: links
        name: Interne Links (Ratchet)
        if: ${{ !cancelled() && steps.aenderungen.outcome == 'success' && steps.aenderungen.outputs.md == 'true' }}
        shell: bash
        env:
          BASIS: ${{ steps.aenderungen.outputs.basis }}
          PFAD: ${{ inputs.pfad }}
        run: |
          LYCHEE=$(bash "$STANDARD/standard/werkzeuge-laden.sh" lychee "$RUNNER_TEMP/werkzeuge")
          export LYCHEE
          bash "$STANDARD/standard/basis-vergleich.sh" links "$BASIS" "$PFAD"
      # Geladen nach $RUNNER_TEMP, damit das Programm nicht selbst im gescannten Baum liegt.
      - id: secrets
        name: Secrets im Diff (gitleaks)
        if: ${{ !cancelled() && steps.aenderungen.outcome == 'success' }}
        shell: bash
        env:
          BASIS: ${{ steps.aenderungen.outputs.basis }}
        run: |
          GITLEAKS=$(bash "$STANDARD/standard/werkzeuge-laden.sh" gitleaks "$RUNNER_TEMP/werkzeuge")
          export GITLEAKS
          bash "$STANDARD/standard/secrets-pruefen.sh" "$BASIS"
      - name: Zusammenfassung
        if: ${{ always() }}
        shell: bash
        env:
          VORBEREITUNG: ${{ steps.standard.outcome }}
          TOR: ${{ steps.aenderungen.outcome }}
          MD: ${{ steps.aenderungen.outputs.md }}
          REPO: ${{ steps.repo.outcome }}
          LINT: ${{ steps.lint.outcome }}
          LINKS: ${{ steps.links.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
        run: |
          wort() {
            case "$1" in
              success) echo "grün" ;; cancelled) echo "abgebrochen" ;;
              # aenderungen.sh endet nur mit 0 oder 2: ein rotes Tor heißt „Dateiliste nicht lesbar“.
              failure) if [ "$2" = tor ]; then echo "**nicht geprüft** (Dateiliste nicht lesbar)"; else echo "**rot**"; fi ;;
              skipped) if [ "$2" = md ] && [ "$MD" = false ]; then echo "keine Markdown-Änderung"; else echo "nicht gelaufen"; fi ;;
              *) echo "nicht gelaufen" ;;
            esac
          }
          {
            echo "### doc-standard"
            echo
            echo "| Prüfung | Ergebnis |"
            echo "|---|---|"
            echo "| Vorbereitung (Wächter, Standard) | $(wort "$VORBEREITUNG") |"
            echo "| Tor (geänderte Markdown-Dateien) | $(wort "$TOR" tor) |"
            echo "| Struktur (pruefe-repo.sh) | $(wort "$REPO") |"
            echo "| Markdown-Lint | $(wort "$LINT" md) |"
            echo "| Interne Links | $(wort "$LINKS" md) |"
            echo "| Secrets im Diff | $(wort "$SECRETS") |"
            echo
            echo "Befunde stehen im Log des jeweiligen Schritts."
          } >> "$GITHUB_STEP_SUMMARY"

  drift-hinweis:
    # Nur PRs aus demselben Repo: bei Fork-PRs ist das Token nur lesend, der Kommentar scheiterte.
    if: github.event_name == 'pull_request' && inputs.drift-pfade != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRIFT_PFADE: ${{ inputs.drift-pfade }}
        with:
          script: |
            const regeln = process.env.DRIFT_PFADE.split('\n')
              .map(z => z.split('->').map(t => t.trim()))
              .filter(t => t.length === 2 && t[0] && t[1]);
            const dateien = (await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            })).map(f => f.filename);
            const treffer = regeln.filter(([code, doku]) =>
              dateien.some(f => f.startsWith(code)) && !dateien.some(f => f.startsWith(doku)));
            if (treffer.length === 0) return;
            const marke = '<!-- doc-standard:drift -->';
            const body = `${marke}\n**Drift-Hinweis:** Code geändert, zugehörige Doku nicht.\n\n` +
              treffer.map(([code, doku]) => `- \`${code}\` geändert, \`${doku}\` nicht`).join('\n') +
              '\n\nNur ein Hinweis, der Lauf schlägt dadurch nicht fehl.';
            const kommentare = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const alt = kommentare.find(k => k.body && k.body.startsWith(marke));
            if (alt) await github.rest.issues.updateComment({ ...context.repo, comment_id: alt.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
