name: selbsttest

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: selbsttest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefe-repo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: bash standard/pruefe-repo.test.sh

  vorlagen-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      # Versionen fest, damit ein neues Release den Selbsttest nicht still ändert.
      - run: pipx install copier==9.19.1 && npm install --global markdownlint-cli2@0.24.0
      - run: bash standard/vorlagen.test.sh

  # Der reusable Workflow einmal gegen ein gültiges Testverzeichnis, mit Skript und Regeln
  # aus genau diesem Commit (standard-ref), nicht aus main.
  doc-standard-gueltig:
    uses: ./.github/workflows/doc-standard.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      pfad: tests/fixtures/profil-M
      standard-ref: ${{ github.sha }}
