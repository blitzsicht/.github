name: doc-standard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  doc-standard:
    # Beide Refs gleich halten: Workflow und Prüfskript kommen aus demselben Stand.
    uses: blitzsicht/.github/.github/workflows/doc-standard.yml@standard-v1.2
    with:
      standard-ref: standard-v1.2
      # Eigener Runner (x64 oder arm64): {% raw %}runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}{% endraw %}
      # Dateien, die nicht umformatiert werden dürfen (ein Glob je Zeile, nur vom Lint ausgenommen):
      # lint-ignores: |
      #   vendor/**/*.md
